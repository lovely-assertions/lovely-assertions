# SonarQube Cloud analysis. The project and organisation keys must match what
# exists at https://sonarcloud.io; the scan job in ci.yml skips itself with a
# warning until SONAR_TOKEN is set as a repository secret.
#
# READ THIS BEFORE TRUSTING THE DASHBOARD. SonarQube Cloud has two mutually
# exclusive modes, and **Automatic Analysis ignores this entire file**. With it
# on, the dashboard analyses the repository with default settings: `tests/` and
# `typing_tests/` are graded as production code, `typing_tests/negative/` is not
# excluded even though it exists to be rejected, and `.github/` is scanned as a
# source although `sonar.sources` below says `src`. The result is a few thousand
# findings about fixtures and none of the scoping decisions recorded here.
#
# So: turning on the CI scan means turning Automatic Analysis **off**, in the
# project's settings on sonarcloud.io. Leaving both on is not additive -- the
# second one to run is the one you see, and only one of them reads this file.
sonar.projectKey=lovely-assertions_lovely-assertions
sonar.organization=lovely-assertions
sonar.projectName=lovely-assertions

sonar.sources=src
sonar.tests=tests,typing_tests
sonar.sourceEncoding=UTF-8

# Both rows of the supported matrix, so Sonar does not report syntax it thinks
# is invalid on the older one.
sonar.python.version=3.13,3.14

# Written by the `coverage floor` job from the combined data of every runner, so
# what Sonar reports is the union of what CI actually executed -- not one
# platform's view of a package whose filesystem assertions differ by platform.
sonar.python.coverage.reportPaths=coverage.xml

# `typing_tests/negative/` is a corpus that exists to be *rejected* by a type
# checker. Its contents are deliberately wrong, and every finding Sonar raises
# against it is a finding about the fixture rather than about the library.
sonar.exclusions=typing_tests/negative/**

# ---------------------------------------------------------------------------
# Rules turned off, each for a reason, each scoped to where the reason applies.
#
# Nothing here is switched off because it was inconvenient. Every entry was
# checked by reading the code it fires on, and several were checked by applying
# the fix Sonar suggests and watching what broke.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

# S5778 -- "only one invocation possibly throwing" -- on a suite whose subject is
# a fluent API. `with pytest.raises(...): expect(v).is_positive()` is two calls,
# and that is the shape of every failure test here. The rule's worry is that the
# wrong call threw and the test passed for the wrong reason. Two things answer
# it: test_happy_path.py calls *every* public assertion in a passing way with the
# whole failure path booby-trapped, from a table derived by introspection -- so a
# dispatcher that raised would turn that red first and name itself -- and most of
# these blocks also pin the message, by `match=` or by comparing `str(...)`,
# which says which assertion produced it.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.py

# S5863 -- "same actual and expected expression" -- on the tests that pin
# `__eq__` and `__hash__`. Two separately built values that compare equal is the
# claim being made; textual identity is not semantic identity.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5863
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.py

# S9136 -- "misspelled mock assertion". The misspelling is the subject: these two
# tests assert that `Mock`'s denylist catches `assert_called_once_wth` and that
# `unsafe=True` turns that protection off.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S9136
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/test_mock.py

# S1481 -- "unused local variable". They are PEP 695 type parameters:
# `def is_not_none[S](...)` declares `S`, it does not assign it. Sonar reads the
# bracket list as a body.
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1481
sonar.issue.ignore.multicriteria.e4.resourceKey=src/**/*.py

# S7632 -- "fix the syntax of this suppression comment". The syntax is ruff's:
# `# noqa: CODE  (why)`. Verified by removing one and watching ruff report the
# rule again, and by `RUF100`, which fails the build on a suppression that
# stopped suppressing anything.
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S7632
sonar.issue.ignore.multicriteria.e5.resourceKey=src/**/*.py

# S1764 -- "identical sub-expressions". `value != value` is the NaN test. It is
# not `math.isnan`, deliberately: `math` is not loaded at interpreter start, the
# call measures slower, and it raises `TypeError` on the `Decimal` and `Mock`
# subjects this predicate is required to answer for. Each site carries
# `# noqa: PLR0124` with the reason inline.
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S1764
sonar.issue.ignore.multicriteria.e6.resourceKey=src/**/*.py

# S2583/S2589 -- "condition always evaluates to false". Downstream of the same
# misreading: Sonar decides `value != value` is always false, therefore `is_nan`
# always returns False, therefore every `if is_nan(...)` is dead. It is not:
# coverage runs in branch mode and reports none of these lines as a partial
# branch, so the suite takes both sides of every one of them.
sonar.issue.ignore.multicriteria.e7.ruleKey=pythonbugs:S2583
sonar.issue.ignore.multicriteria.e7.resourceKey=src/**/*.py
sonar.issue.ignore.multicriteria.e8.ruleKey=pythonbugs:S2589
sonar.issue.ignore.multicriteria.e8.resourceKey=src/**/*.py
