name: Release

# Tag-driven. `v0.1.0` on `main` builds, verifies, publishes to PyPI through
# Trusted Publishing, and opens the GitHub release. There is no stored API
# token anywhere in this repository: PyPI mints a short-lived credential from
# the workflow's OIDC identity, which is why the publish job runs from this
# file, under this environment name, and nowhere else.
#
# Rehearsal: `workflow_dispatch` with `target: testpypi` runs the whole path
# against TestPyPI without touching the real index.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

# A release is never cancelled by a later push: a half-published version cannot
# be taken back.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.4"

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # No shared cache on a job whose output people install.
          enable-cache: false

      - run: uv build

      # `__version__` in the package is the single source of truth, and the tag
      # is a human typing it a second time. Disagreement here means one of the
      # two is a mistake, and finding out after the upload is too late -- PyPI
      # will not let a version number be reused.
      - name: the tag and the package must agree
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(uv run --no-project --with ./dist/*.whl python -c \
            'import lovely_assertions; print(lovely_assertions.__version__)')"
          echo "package version: $version"
          if [ "$EVENT_NAME" = "push" ]; then
            tagged="${REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "::error::tag $REF_NAME does not match __version__ $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: metadata renders on PyPI
        run: uvx twine==7.0.0 check --strict dist/*

      - name: wheel contents
        run: uvx check-wheel-contents==0.6.3 dist/*.whl

      - name: the wheel must carry py.typed and declare no dependencies
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          archive = zipfile.ZipFile(wheel)
          names = archive.namelist()

          if "lovely_assertions/py.typed" not in names:
              sys.exit(f"py.typed is missing from {wheel.name}: {names}")

          metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          metadata = archive.read(metadata_name).decode("utf-8")
          requires = [
              line for line in metadata.splitlines() if line.startswith("Requires-Dist:")
          ]
          if requires:
              sys.exit(f"zero runtime dependencies is a contract, but {wheel.name} declares {requires}")

          print(f"{wheel.name}: py.typed present, Requires-Dist empty")
          PY

      # The suite runs against the *installed wheel* rather than the source
      # tree, in a project-free environment. A packaging mistake -- a module
      # left out of the wheel, a data file the build backend dropped -- is
      # invisible to a run that imports from `src/`.
      # The test runner comes from `uv.lock`, not from a resolution done here.
      # This is the gate that decides whether a release ships, so the tool it
      # runs on must not be able to change between the pull request that was
      # reviewed and the tag that is cut -- and `--with pytest` resolved the
      # newest release every time it ran.
      #
      # `--no-install-project` is what keeps the wheel under test: it installs
      # the locked development tools and nothing else, so `lovely_assertions` is
      # absent from the environment until the wheel puts it there. Installing
      # the project as well would shadow the wheel with `src/` and quietly test
      # the wrong thing.
      #
      # `--no-build` and `--only-binary :all:` say the rest out loud: nothing in
      # this environment may be installed by building a source distribution,
      # which would run that distribution's build code on a runner holding the
      # release credentials. It holds because every locked dependency publishes
      # a wheel -- an invariant tests/test_packaging.py reads out of the lock, so
      # a dependency that stops publishing one fails review rather than this job.
      # (An ordinary `uv sync` could not ask for this: it installs the project
      # itself as an editable, which has no wheel by definition.)
      - name: the built wheel passes its own suite
        run: |
          set -euo pipefail
          uv sync --locked --no-install-project --no-build --group dev
          uv pip install --only-binary :all: ./dist/*.whl
          uv run --no-sync --no-build pytest tests -q -p no:cacheprovider \
            --ignore=tests/test_typing_surface.py \
            --ignore=tests/test_packaging.py \
            --ignore=tests/test_source_conventions.py \
            --ignore=tests/test_documentation.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: build provenance
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      # Signing the attestation, and recording it against this repository.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      # The attestation lives in GitHub's own store, which is the right home for
      # it -- `gh attestation verify` reads it there. But somebody who downloads
      # a wheel from the Releases page has only what is attached to the release,
      # so the bundle is carried across as a file and attached alongside the
      # distributions. Verifiable offline, by whoever has the files and nothing
      # else.
      - name: carry the bundle to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "lovely_assertions-${VERSION}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: "*.sigstore.json"
          if-no-files-found: error

  publish:
    name: publish to ${{ inputs.target || 'pypi' }}
    runs-on: ubuntu-latest
    needs: [build, provenance]
    # The environment is half of the Trusted Publishing configuration on PyPI:
    # the publisher is bound to this repository, this workflow file *and* this
    # environment name, so a workflow added elsewhere in the repo cannot mint a
    # credential. It is also where a manual approval gate goes.
    environment:
      name: ${{ inputs.target || 'pypi' }}
      url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/p/lovely-assertions' || 'https://pypi.org/p/lovely-assertions' }}
    permissions:
      # Mints the OIDC token PyPI exchanges for a short-lived upload
      # credential. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # PEP 740 attestations, signed with the same OIDC identity that does
          # the upload, so the index can show what built each file.
          attestations: true
          print-hash: true
          # A rehearsal has to be repeatable, and a version number is not: the
          # second dispatch for the same `__version__` would be refused with
          # "file already exists". Tolerated on TestPyPI, which exists to be
          # rehearsed against, and never on the real index -- there, an upload
          # that finds the version already present means the tag is wrong, and
          # silently succeeding would hide it.
          skip-existing: ${{ inputs.target == 'testpypi' }}

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build, provenance, publish]
    if: github.event_name == 'push'
    permissions:
      # Creating the release and attaching the built files to it.
      contents: write
    steps:
      # git-cliff reads the whole history and the tags, so neither may be shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          # This job attaches the distributions to the release, so it is a job
          # whose output people install: no shared cache, for the same reason
          # the build job has none.
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: dist
      # The release body is rendered from the commits in this tag, by the same
      # tool and template a maintainer runs to regenerate CHANGELOG.md before
      # tagging -- so the two cannot say different things about the same release.
      # Nothing here writes CHANGELOG.md: committing from a release workflow
      # would put a bot commit after the tag it is describing. Regenerating it is
      # a step in the release checklist in CONTRIBUTING.md, and this job is what
      # makes forgetting it cost nothing on the release page itself.
      - name: render this tag's notes from its commits
        run: |
          set -euo pipefail
          uvx git-cliff==2.13.1 --current --strip header -o release-notes.md
          cat release-notes.md
      # `gh` is on the runner, so this is a script step rather than a pinned
      # third-party action: nothing extra to audit or trust.
      #
      # Two routes reach this step, and the difference is whether a release
      # already exists for the tag. release-please tags *and* opens the release
      # when its pull request merges, so by the time this runs the page is
      # already there with notes derived from the same commits -- there is
      # nothing to create, only the distributions and the provenance bundle to
      # attach. A tag pushed by hand has no release, so this opens one, with
      # notes rendered from the commits in the tag.
      #
      # Upload rather than create is not an optimisation: `gh release create`
      # on an existing tag fails, which would have turned every release-please
      # release red at the last step, after the upload to PyPI had already
      # happened and could not be taken back.
      - name: attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists (release-please opened it); attaching files"
            gh release upload "$TAG" dist/* --clobber
          else
            echo "no release for $TAG yet; opening one"
            prerelease=""
            case "$VERSION" in
              *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;;
            esac
            # shellcheck disable=SC2086
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md \
              $prerelease \
              dist/*
          fi
